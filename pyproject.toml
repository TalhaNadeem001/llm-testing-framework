[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-tester"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "google-genai>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "textual>=0.70.0",
]

[project.scripts]
llm-tester = "llm_tester.cli:main"
